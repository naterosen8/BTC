<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitcoin DCA Calculator</title>
  <meta name="description" content="See what buying a little Bitcoin on a schedule would have turned into, with fees included.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Dollar-cost averaging</p>
    <h1>What if you'd bought a little Bitcoin every week?</h1>
    <p class="lede">Pick an amount and a time period. We replay real historical prices to show what you'd have today.</p>

    <form id="dca-form" class="calc">
      <label>
        Buy
        <span class="money"><input id="amount" type="number" min="1" step="1" value="5" inputmode="decimal"></span>
      </label>
      <label>
        every
        <select id="frequency">
          <option value="daily">day</option>
          <option value="weekly" selected>week</option>
          <option value="monthly">month</option>
        </select>
      </label>
      <label>
        <select id="period" aria-label="Time period">
          <option value="1">for the last year</option>
          <option value="2">for the last 2 years</option>
          <option value="3">for the last 3 years</option>
          <option value="4">for the last 4 years</option>
          <option value="5" selected>for the last 5 years</option>
          <option value="10">for the last 10 years</option>
          <option value="since:2013">since 2013</option>
          <option value="all">since 2010 (all time)</option>
        </select>
      </label>
      <label>
        with a fee of
        <span class="pct"><input id="fee" type="number" min="0" max="10" step="0.1" value="0"></span>
      </label>
    </form>

    <section id="result" class="result" aria-live="polite">
      <p class="status">Loading price data…</p>
    </section>

    <p id="source" class="fine"></p>
    <p class="fine">Past performance doesn't predict future results. This is an educational tool, not financial advice.</p>
  </main>

  <script src="js/dca.js"></script>
  <script src="js/prices.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
